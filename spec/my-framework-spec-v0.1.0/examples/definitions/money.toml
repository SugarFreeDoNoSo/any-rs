api_version = "framework/v1alpha1"
kind = "ValueObject"
id = "sales.money"
version = 1
immutable = true

[fields.amount]
type = "string"
format = "decimal"
required = true
nullable = false
pattern = '^(0|[1-9][0-9]*)\.[0-9]{2}$'

[fields.currency]
type = "string"
required = true
nullable = false
one_of = ["CLP", "USD", "EUR"]
