name: Validate specification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: spec/my-framework-spec-v0.1.0/tools/requirements.txt
      - name: Install original validator dependencies
        run: python -m pip install -r spec/my-framework-spec-v0.1.0/tools/requirements.txt
      - name: Validate preservation, repository, and original specification
        run: python tools/validate.py
      - name: Validate proposed adapter contracts
        run: python tools/validate_adapter_contracts.py
      - name: Test repository and offline adapter contract models
        run: python -m unittest discover -s tests -v
